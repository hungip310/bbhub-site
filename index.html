<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBHub</title>
<meta name="description" content="">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap">
  <a href="#home" class="logo"><img src="logo.png" alt="BBHub"></a>
  <nav id="nav">
    <a href="#home" data-i18n="nav.home"></a>
    <a href="#broadband" data-i18n="nav.broadband"></a>
    <a href="#ai" data-i18n="nav.ai"></a>
    <a href="#acquiring" data-i18n="nav.acquiring"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>
  <div class="lang" id="lang">
    <button data-lang="zh-Hant">繁</button><button data-lang="zh-Hans">简</button><button data-lang="en">EN</button>
  </div>
</div></header>

<main>
<div class="page" id="home">
  <div class="hero"><div class="wrap">
    <h1 data-i18n-html="home.h1"></h1>
    <p data-i18n="home.p"></p>
    <a href="#ai" class="btn" data-i18n="home.cta1"></a><a href="#contact" class="btn ghost" data-i18n="home.cta2"></a>
  </div></div>
  <section class="rich"><div class="wrap">
    <h2 data-i18n="home.services"></h2><p class="sub" data-i18n="home.services.sub"></p>
    <div class="grid">
      <a href="#broadband" class="card"><div class="ic">🌐</div><h3 data-i18n="bb.title"></h3><p data-i18n="bb.card"></p></a>
      <a href="#ai" class="card"><div class="ic">🤖</div><h3>HKBN AI+</h3><p data-i18n="ai.card"></p></a>
      <a href="#acquiring" class="card"><div class="ic">🏪</div><h3 data-i18n="acq.title"></h3><p data-i18n="acq.card"></p></a>
    </div>
  </div></section>
</div>

<div class="page" id="broadband">
  <section class="rich broadband"><div class="wrap narrow">
    <h2 data-i18n="bb.title"></h2><p class="sub" data-i18n="bb.sub"></p>
    <div class="panel left"><p data-i18n="bb.p1"></p>
    <ul class="ticks"><li data-i18n="bb.l1"></li><li data-i18n="bb.l2"></li><li data-i18n="bb.l3"></li></ul>
    <p data-i18n="bb.offer"></p>
    <p class="note" data-i18n="bb.note"></p>
    <a href="#contact" class="btn" data-i18n="common.enquire"></a></div>
  </div></section>
</div>

<div class="page" id="ai">
  <div class="hero small"><div class="wrap">
    <h1>HKBN AI+ <small data-i18n="ai.hero.small"></small></h1>
    <p data-i18n="ai.hero.p"></p>
  </div></div>
  <section class="rich"><div class="wrap">
    <h2 data-i18n="ai.agents"></h2><p class="sub" data-i18n="ai.agents.sub"></p>
    <div class="grid">
      <div class="card"><h3 data-i18n="ai.hr"></h3><p data-i18n="ai.hr.p"></p></div>
      <div class="card"><h3 data-i18n="ai.mkt"></h3><p data-i18n="ai.mkt.p"></p></div>
      <div class="card"><h3 data-i18n="ai.fin"></h3><p data-i18n="ai.fin.p"></p></div>
      <div class="card"><h3 data-i18n="ai.legal"></h3><p data-i18n="ai.legal.p"></p></div>
      <div class="card"><h3 data-i18n="ai.sales"></h3><p data-i18n="ai.sales.p"></p></div>
    </div>
  </div></section>
  <section class="rich"><div class="wrap">
    <h2 data-i18n="ai.why"></h2><p class="sub" data-i18n="ai.why.sub"></p>
    <div class="why">
      <div><b>100+</b><span data-i18n="ai.w1"></span></div>
      <div><b data-i18n="ai.w2.t"></b><span data-i18n="ai.w2"></span></div>
      <div><b data-i18n="ai.w3.t"></b><span data-i18n="ai.w3"></span></div>
      <div><b data-i18n="ai.w4.t"></b><span data-i18n="ai.w4"></span></div>
    </div>
  </div></section>
  <section class="rich"><div class="wrap">
    <h2 data-i18n="ai.price"></h2><p class="sub" data-i18n="ai.price.sub"></p>
    <div class="grid">
      <div class="card price"><h3>WorkMate STARTER</h3><div class="amt">HK$98<span data-i18n="ai.permonth"></span></div>
        <ul><li data-i18n="ai.s1"></li><li data-i18n="ai.s2"></li><li data-i18n="ai.skills"></li><li data-i18n="ai.term"></li></ul></div>
      <div class="card price hot"><div class="tag" data-i18n="ai.hot"></div><h3>WorkMate ESSENTIAL</h3><div class="amt">HK$298<span data-i18n="ai.permonth"></span></div>
        <ul><li data-i18n="ai.e1"></li><li data-i18n="ai.e2"></li><li data-i18n="ai.skills"></li><li data-i18n="ai.term"></li></ul></div>
      <div class="card price"><h3>CubeRouter FLEX</h3><div class="amt">HK$1,288<span data-i18n="ai.perpurchase"></span></div>
        <ul><li data-i18n="ai.f1"></li><li data-i18n="ai.f2"></li><li data-i18n="ai.f3"></li></ul></div>
    </div>
    <p class="note"><span data-i18n="ai.note"></span><br><span data-i18n="ai.source"></span> <a href="https://www.hkbnes.com/web/tc/hkbn-ai/" target="_blank" rel="noopener">HKBN Enterprise Solutions</a></p>
    <p class="center"><a href="#contact" class="btn" data-i18n="common.enquire.now"></a></p>
  </div></section>
</div>

<div class="page" id="acquiring">
  <section class="rich acquiring"><div class="wrap narrow">
    <h2 data-i18n="acq.title"></h2><p class="sub" data-i18n="acq.sub"></p>
    <div class="panel left"><p data-i18n="acq.p1"></p>
    <ul class="ticks"><li data-i18n="acq.l1"></li><li data-i18n="acq.l2"></li><li data-i18n="acq.l3"></li><li data-i18n="acq.l4"></li><li data-i18n="acq.l5"></li></ul>
    <a href="#contact" class="btn" data-i18n="common.enquire"></a></div>
  </div></section>
</div>

<div class="page" id="contact">
  <section class="rich contact"><div class="wrap narrow center">
    <h2 data-i18n="contact.title"></h2><p class="sub" data-i18n="contact.sub"></p>
    <div class="panel">
      <p><b data-i18n="contact.company"></b></p>
      <p>Facebook：<a href="https://www.facebook.com/BBHub.HK/" target="_blank" rel="noopener"><b data-i18n="contact.fbname"></b></a></p>
      <p><span data-i18n="contact.tel"></span> <a href="mailto:sales@bbhub.global"><b>sales@bbhub.global</b></a></p>
      <p><a class="btn" href="https://www.facebook.com/BBHub.HK/" target="_blank" rel="noopener" data-i18n="contact.fbbtn"></a></p>
    </div>
  </div></section>
</div>

<div class="page" id="privacy">
  <section><div class="wrap narrow">
    <h2 data-i18n="privacy.title"></h2>
    <article class="policy" id="policy"></article>
  </div></section>
</div>
<div class="page" id="terms">
  <section><div class="wrap narrow">
    <h2 data-i18n="terms.title"></h2>
    <article class="policy" id="terms-body"></article>
  </div></section>
</div>
</main>

<footer>
  <div>© 2026 BBHub Limited</div>
  <div class="flinks"><a href="#privacy" data-i18n="privacy.title"></a> · <a href="#terms" data-i18n="terms.title"></a> · <a href="#" id="open-cookie" data-i18n="cookie.settings"></a></div>
</footer>

<div id="cookie-banner" class="cookie" role="dialog" aria-live="polite" hidden>
  <p><span data-i18n="cookie.text"></span> <a href="#privacy" data-i18n="privacy.title"></a></p>
  <div class="cbtns">
    <button class="btn" id="ck-accept" data-i18n="cookie.acceptall"></button>
    <button class="btn line" id="ck-settings" data-i18n="cookie.settings"></button>
  </div>
</div>

<div id="cookie-modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <button class="mclose" id="ck-close" aria-label="Close">×</button>
    <h3 data-i18n="cookie.pref.title"></h3>
    <p data-i18n="cookie.pref.intro"></p>
    <div class="ckrow"><div><b data-i18n="cookie.c1"></b><small data-i18n="cookie.c1.d"></small></div><span class="always" data-i18n="cookie.always"></span></div>
    <div class="ckrow"><div><b data-i18n="cookie.c2"></b><small data-i18n="cookie.c2.d"></small></div><label class="sw"><input type="checkbox" id="ck-perf"><i></i></label></div>
    <div class="ckrow"><div><b data-i18n="cookie.c3"></b><small data-i18n="cookie.c3.d"></small></div><label class="sw"><input type="checkbox" id="ck-func"><i></i></label></div>
    <div class="ckrow"><div><b data-i18n="cookie.c4"></b><small data-i18n="cookie.c4.d"></small></div><label class="sw"><input type="checkbox" id="ck-tgt"><i></i></label></div>
    <div class="cbtns">
      <button class="btn" id="ck-acceptall2" data-i18n="cookie.acceptall"></button>
      <button class="btn line" id="ck-reject" data-i18n="cookie.reject"></button>
      <button class="btn line" id="ck-save" data-i18n="cookie.save"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="policy.js"></script>
<script src="terms.js"></script>
<script src="app.js"></script>
</body>
</html>
