<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">BBHub 商戶收單服務宣傳圖</title>
  <desc id="description">一部收款機支援多種電子付款方式，讓顧客付款更方便，店舖收款更順暢。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#dceff4"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb3c8"/>
      <stop offset="1" stop-color="#1d4f63"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#173f50" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#background)"/>
  <circle cx="1010" cy="145" r="205" fill="#2fb3c8" opacity=".10"/>
  <circle cx="30" cy="1010" r="235" fill="#1d4f63" opacity=".08"/>
  <path d="M0 755c185-67 299 63 467 24 179-41 239-131 400-86 89 25 147 80 213 57v330H0z" fill="#fff" opacity=".48"/>

  <image href="logo.png" x="72" y="58" width="205" height="49" preserveAspectRatio="xMinYMid meet"/>
  <rect x="72" y="146" width="203" height="48" rx="24" fill="#1d4f63"/>
  <text x="173.5" y="178" fill="#fff" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" letter-spacing="2">商戶收單服務</text>

  <text x="72" y="292" fill="#173f50" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="66" font-weight="800" letter-spacing="1">收款更方便</text>
  <text x="72" y="378" fill="#173f50" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="66" font-weight="800" letter-spacing="1">生意更順手</text>
  <rect x="74" y="409" width="100" height="8" rx="4" fill="#f5a623"/>
  <text x="72" y="467" fill="#45636d" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="28">一部收款機，多種付款方式</text>

  <g filter="url(#shadow)" transform="translate(665 205) rotate(7 165 235)">
    <rect x="20" y="8" width="310" height="465" rx="44" fill="#173f50"/>
    <rect x="36" y="24" width="278" height="433" rx="32" fill="#fff"/>
    <rect x="58" y="53" width="234" height="196" rx="24" fill="url(#terminal)"/>
    <circle cx="175" cy="136" r="45" fill="#fff" opacity=".16"/>
    <path d="M152 137h45m-22-22v45" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <text x="175" y="218" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1">TAP TO PAY</text>
    <rect x="75" y="274" width="200" height="54" rx="15" fill="#eaf6f8"/>
    <circle cx="108" cy="301" r="9" fill="#2fb3c8"/>
    <circle cx="137" cy="301" r="9" fill="#f5a623"/>
    <circle cx="166" cy="301" r="9" fill="#1d4f63"/>
    <rect x="75" y="347" width="54" height="54" rx="14" fill="#f1f7f8"/>
    <rect x="147" y="347" width="54" height="54" rx="14" fill="#f1f7f8"/>
    <rect x="219" y="347" width="54" height="54" rx="14" fill="#f1f7f8"/>
    <circle cx="102" cy="374" r="8" fill="#2fb3c8"/>
    <circle cx="174" cy="374" r="8" fill="#f5a623"/>
    <circle cx="246" cy="374" r="8" fill="#1d4f63"/>
    <rect x="136" y="13" width="78" height="7" rx="3.5" fill="#d5e0e2"/>
  </g>
  <circle cx="893" cy="633" r="40" fill="#fff" filter="url(#shadow)"/>
  <path d="m875 633 12 12 25-27" fill="none" stroke="#2fb3c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="72" y="560" fill="#1d4f63" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="23" font-weight="700">顧客付款更方便，店舖收款更順暢</text>
  <g font-family="Arial, Noto Sans TC, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="72" y="594" width="133" height="48" rx="24" fill="#fff"/>
    <text x="138.5" y="625" fill="#1d4f63">信用卡</text>
    <rect x="218" y="594" width="140" height="48" rx="24" fill="#fff"/>
    <text x="288" y="625" fill="#1d4f63">AlipayHK</text>
    <rect x="371" y="594" width="151" height="48" rx="24" fill="#fff"/>
    <text x="446.5" y="625" fill="#1d4f63">WeChat Pay</text>
    <rect x="72" y="658" width="148" height="48" rx="24" fill="#fff"/>
    <text x="146" y="689" fill="#1d4f63">Apple Pay</text>
    <rect x="233" y="658" width="159" height="48" rx="24" fill="#fff"/>
    <text x="312.5" y="689" fill="#1d4f63">Google Pay</text>
    <rect x="405" y="658" width="117" height="48" rx="24" fill="#fff"/>
    <text x="463.5" y="689" fill="#1d4f63">更多</text>
  </g>

  <rect x="72" y="788" width="936" height="170" rx="30" fill="#1d4f63"/>
  <text x="112" y="847" fill="#aeeaf0" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="21" font-weight="700" letter-spacing="1">BBHub 商戶收單服務</text>
  <text x="112" y="900" fill="#fff" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="29" font-weight="700">為你的生意配對合適收款方案</text>
  <rect x="746" y="832" width="220" height="76" rx="38" fill="#2fb3c8"/>
  <text x="856" y="880" fill="#fff" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="25" font-weight="700">立即查詢  →</text>
  <text x="72" y="1006" fill="#607b83" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="17">實際支援的付款方式、交易費及服務條款以供應商最終資料為準。</text>
</svg>
